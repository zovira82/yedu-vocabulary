<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>页词 · 阅读生词本</title><meta name="description" content="导入阅读词表，按计划学习和复习。"><link rel="stylesheet" href="./style.css?v=20261125-import2"></head><body>
<header><a class="brand" href="#home"><span class="brandmark">页</span>页词<span class="brandnote">我的阅读生词本</span></a><button class="quiet" id="settings">⚙ <span>DeepSeek 设置</span></button></header>
<div class="shell"><aside><div class="sidecaption">学习空间</div><nav><button data-view="home" class="active">◷　今日学习</button><button data-view="library">▤　我的词本 <span id="deckcount">0</span></button></nav><button class="primary" id="importSide">＋ 导入阅读词表</button><div class="sidebottom"><div class="leaf">✳</div><p>阅读词表与学习进度</p><button class="text" id="backup">导出学习备份</button><label class="text filelabel">恢复备份<input type="file" id="restore" accept="application/json" hidden></label><small>词本和进度保存在此浏览器</small></div></aside>
<main id="main"></main></div>
<dialog id="importDialog" class="import-dialog" aria-labelledby="importHeading">
<div class="dialoghead"><h2 id="importHeading">导入词表</h2><button class="icon close" aria-label="关闭">×</button></div>
<div class="import-scroll">
<label class="titlefield">词本名称<input id="deckTitle" placeholder="例如：2024 英语一 · Text 1" maxlength="100"></label>
<div class="pastehead"><label for="raw">词表内容</label><div><button id="example" class="text">示例</button><button id="prompt" class="text">复制豆包提示词</button></div></div>
<textarea id="raw" rows="5" aria-label="词表内容" placeholder="粘贴豆包整理的词表、Markdown 或 JSON&#10;&#10;单词 | 释义 | 原句（可选）&#10;persist | v. 坚持；持续 | The problem may persist."></textarea>
<div class="formatnote">规范词表选“直接解析”，自由格式选“DeepSeek 解析”。</div>
<div id="importStatus" role="status" tabindex="-1" hidden></div>
<div id="preview" tabindex="-1"></div>
</div>
<div class="import-footer"><div class="parse-actions"><button id="parse" class="secondary">直接解析词表</button><button id="aiParse" class="primary">DeepSeek 解析</button></div><button id="confirmImport" class="primary" hidden>保存并背词</button></div>
</dialog>
<dialog id="settingsDialog"><div class="dialoghead"><div><h2>连接 DeepSeek</h2><p>用于整理自由格式的词表。</p></div><button class="icon close" aria-label="关闭">×</button></div><label>API Key<input type="password" id="apiKey" autocomplete="off" placeholder="在此粘贴你的 DeepSeek API Key"></label><label>模型<input id="model" value="deepseek-flash" maxlength="80"></label><p class="muted" id="keyUsage">Key 与模型设置保存在当前浏览器，刷新后自动恢复。Key 保存在当前浏览器，由本站服务端转发到 api.deepseek.com，不写入词本或备份。</p><p class="muted">默认模型参照 <a href="https://api-docs.deepseek.com/quick_start/pricing" target="_blank" rel="noreferrer">DeepSeek 官方文档</a>，也可填写你账户可用的模型名称。</p><div class="settings-actions"><button id="saveSettings" class="primary">保存设置</button><button id="clearApiKey" class="secondary">清除 Key</button></div><p id="settingsStatus" role="status"></p><hr style="border:0;border-top:1px solid var(--line);margin:24px 0"><h3>学习数据</h3><div class="actions"><button class="secondary" id="settingsBackup">导出备份</button><button class="secondary" id="settingsRestore">恢复备份</button></div><p class="muted">换网址或设备前，先导出备份，再在新网页恢复。</p></dialog>
<div id="toast" role="status"></div><script type="module" src="./app.js?v=20261125-import2"></script></body></html>
