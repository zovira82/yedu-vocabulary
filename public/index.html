<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>页词 · 阅读生词本</title><meta name="description" content="导入阅读词表，按计划学习和复习。"><link rel="stylesheet" href="./style.css"></head><body>
<header><a class="brand" href="#home"><span class="brandmark">页</span>页词<span class="brandnote">我的阅读生词本</span></a><button class="quiet" id="settings">⚙ <span>DeepSeek 设置</span></button></header>
<div class="shell"><aside><div class="sidecaption">学习空间</div><nav><button data-view="home" class="active">◷　今日学习</button><button data-view="library">▤　我的词本 <span id="deckcount">0</span></button></nav><button class="primary" id="importSide">＋ 导入阅读词表</button><div class="sidebottom"><div class="leaf">✳</div><p>阅读词表与学习进度</p><button class="text" id="backup">导出学习备份</button><label class="text filelabel">恢复备份<input type="file" id="restore" accept="application/json" hidden></label><small>词本和进度保存在此浏览器</small></div></aside>
<main id="main"></main></div>
<dialog id="importDialog"><div class="dialoghead"><div><h2>导入词表</h2><p>复制豆包整理的内容，粘贴在这里。</p></div><button class="icon close" aria-label="关闭">×</button></div><label>词本名称<input id="deckTitle" placeholder="例如：2024 英语一 · 阅读 Text 1" maxlength="100"></label><label>词表内容<textarea id="raw" rows="8" placeholder="支持直接粘贴 AI 的回答、Markdown 表格或 JSON。&#10;&#10;无需 API 的格式（每行一个词，字段用 | 分隔）：&#10;单词 | 中文释义 | 原文例句（可选）&#10;persist | v. 坚持；持续 | The problem may persist."></textarea></label><div class="importtools"><button id="example" class="text">填入示例</button><button id="prompt" class="text">复制给豆包的提示词</button></div><div class="actions"><button id="parse" class="secondary">直接解析词表</button><button id="aiParse" class="primary">✧ DeepSeek 智能整理</button></div><p class="muted">智能整理会将上方内容发送给 DeepSeek，并使用你的 API 额度。原文例句仅保留你提供的内容。</p><p id="importStatus" role="status"></p><div id="preview"></div></dialog>
<dialog id="settingsDialog"><div class="dialoghead"><div><h2>连接 DeepSeek</h2><p>用于整理自由格式的词表。</p></div><button class="icon close" aria-label="关闭">×</button></div><label>API Key<input type="password" id="apiKey" autocomplete="off" placeholder="在此粘贴你的 DeepSeek API Key"></label><label>模型<input id="model" value="deepseek-flash" maxlength="80"></label><p class="muted" id="keyUsage">Key 仅在当前页面内存中使用，刷新后需要重新填写；由本站服务端转发到 api.deepseek.com，不保存到词本或备份。</p><p class="muted">默认模型参照 <a href="https://api-docs.deepseek.com/quick_start/pricing" target="_blank" rel="noreferrer">DeepSeek 官方文档</a>，也可填写你账户可用的模型名称。</p><button id="saveSettings" class="primary full">使用此设置</button><p id="settingsStatus" role="status"></p><hr style="border:0;border-top:1px solid var(--line);margin:24px 0"><h3>学习数据</h3><div class="actions"><button class="secondary" id="settingsBackup">导出备份</button><button class="secondary" id="settingsRestore">恢复备份</button></div><p class="muted">换网址或设备前，先导出备份，再在新网页恢复。</p></dialog>
<div id="toast" role="status"></div><script type="module" src="./app.js"></script></body></html>
